<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de APIs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Catálogo de APIs</h1>
        <a class="btn btn-primary" th:href="@{/api/nuevo}">Nueva API</a>
    </div>

    <!-- Mensaje Flash: aparece una sola vez después del redirect. -->
    <div class="alert alert-success" th:if="${msg != null}" th:text="${msg}"></div>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>#</th>
            <th>Nombre de la API</th>
            <th>Versión</th>
            <th>Fecha de Registro</th>
            <th>Estado</th>
            <th>Equipo responsable</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="api, iterStat : ${apis}">
            <td th:text="${iterStat.count}"></td>
            <td th:text="${api.nombre}"></td>
            <td th:text="${api.version}"></td>
            <td th:text="${api.fechaRegistro}"></td>
            <td th:text="${api.estado}"></td>

            <!-- La relación ManyToOne permite mostrar el nombre del equipo. -->
            <td th:text="${api.equipo.nombre}"></td>

            <td>
                <a class="btn btn-info btn-sm"
                   th:href="@{/api/endpoints(id=${api.id})}">Ver endpoints</a>
                <a class="btn btn-warning btn-sm"
                   th:href="@{/api/editar(id=${api.id})}">Editar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
