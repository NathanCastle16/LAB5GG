<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle de API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>Detalle de API</h1>

    <div class="card mb-4">
        <div class="card-body">
            <p><strong>Nombre:</strong> <span th:text="${api.nombre}"></span></p>
            <p><strong>Versión:</strong> <span th:text="${api.version}"></span></p>
            <p><strong>Estado:</strong> <span th:text="${api.estado}"></span></p>
            <p><strong>Equipo responsable:</strong> <span th:text="${api.equipo.nombre}"></span></p>
        </div>
    </div>

    <h2>Endpoints</h2>

    <!-- El ID viaja oculto; el usuario solo escoge el método HTTP. -->
    <form method="get" th:action="@{/api/endpoints}" class="row g-2 mb-3">
        <input type="hidden" name="id" th:value="${api.id}">

        <div class="col-md-4">
            <select name="metodo" class="form-select">
                <option value="">Todos los métodos</option>
                <option value="GET" th:selected="${metodo == 'GET'}">GET</option>
                <option value="POST" th:selected="${metodo == 'POST'}">POST</option>
                <option value="PUT" th:selected="${metodo == 'PUT'}">PUT</option>
                <option value="DELETE" th:selected="${metodo == 'DELETE'}">DELETE</option>
            </select>
        </div>

        <div class="col-md-2">
            <button type="submit" class="btn btn-primary">Filtrar</button>
        </div>

        <div class="col-md-2">
            <!-- Sin parámetro metodo = limpia el filtro. -->
            <a class="btn btn-secondary"
               th:href="@{/api/endpoints(id=${api.id})}">Mostrar todos</a>
        </div>
    </form>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>#</th>
            <th>Ruta</th>
            <th>Método HTTP</th>
            <th>Descripción</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="endpoint, iterStat : ${endpoints}">
            <td th:text="${iterStat.count}"></td>
            <td th:text="${endpoint.ruta}"></td>
            <td th:text="${endpoint.metodoHttp}"></td>
            <td th:text="${endpoint.descripcion}"></td>
        </tr>
        </tbody>
    </table>

    <p class="alert alert-warning" th:if="${endpoints.isEmpty()}">No se encontraron endpoints.</p>

    <a class="btn btn-secondary" th:href="@{/}">Volver al listado</a>
</div>
</body>
</html>
