<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${api.id == null ? 'Nueva API' : 'Editar API'}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1 th:text="${api.id == null ? 'Nueva API' : 'Editar API'}"></h1>

    <!--
        th:object enlaza el formulario con el objeto api.
        th:field realiza el Data Binding con sus atributos.
    -->
    <form method="post" th:action="@{/api/guardar}" th:object="${api}">

        <!-- Conserva el ID cuando estamos editando. -->
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" th:field="*{nombre}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Versión</label>
            <input type="text" class="form-control" th:field="*{version}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Estado</label>
            <select class="form-select" th:field="*{estado}" required>
                <option value="">Seleccione...</option>
                <option value="Activa">Activa</option>
                <option value="Deprecada">Deprecada</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Equipo</label>

            <!--
                El usuario ve el nombre del equipo, pero el formulario
                envía su ID y lo vincula con api.equipo.id.
            -->
            <select class="form-select" th:field="*{equipo.id}" required>
                <option value="">Seleccione...</option>
                <option th:each="equipo : ${equipos}"
                        th:value="${equipo.id}"
                        th:text="${equipo.nombre}"></option>
            </select>
        </div>

        <!-- La fecha no aparece: el controlador la administra. -->

        <button type="submit" class="btn btn-success"
                th:text="${api.id == null ? 'Registrar' : 'Actualizar'}"></button>

        <a class="btn btn-danger" th:href="@{/}">Cancelar</a>
    </form>
</div>
</body>
</html>
