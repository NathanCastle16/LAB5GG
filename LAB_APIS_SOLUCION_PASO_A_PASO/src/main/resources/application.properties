spring.application.name=lab-apis

# Base solicitada por el laboratorio
spring.datasource.url=jdbc:mysql://localhost:3306/api_registry_db?serverTimezone=America/Lima&useSSL=false&publicKeyRetrieval=true
spring.datasource.username=root

# Coloca tu contraseña de MySQL. Si no tienes, déjalo vacío.
spring.datasource.password=

# Las tablas ya existen en MySQL.
spring.jpa.hibernate.ddl-auto=none

# Permite ver el SQL generado en consola.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
